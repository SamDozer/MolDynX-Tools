[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moldynx-tools"
version = "0.3.0"
description = "MolDynX Tools (formerly mdforge): reusable, extensible framework for reproducible, audited analysis of GROMACS molecular dynamics simulations of arbitrary biomolecular systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hossam Mahmoud" }]
keywords = ["molecular-dynamics", "gromacs", "mdanalysis", "bioinformatics",
            "trajectory-analysis", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "MDAnalysis>=2.7",
    "mdtraj>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "markdown>=3.4",          # self-contained HTML documents
]

[project.optional-dependencies]
energy = ["panedr>=0.8"]                       # read .edr thermodynamics
annotation = ["biopython>=1.80"]               # domain transfer / motif alignment
fingerprints = ["prolif>=2.0", "rdkit>=2023.3"] # interaction fingerprints
pdf = ["weasyprint>=60"]                        # PDF report export
ui = ["rich>=13.0"]                             # nicer CLI output
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
all = ["panedr>=0.8", "biopython>=1.80", "prolif>=2.0", "rdkit>=2023.3", "weasyprint>=60",
       "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/SamDozer/molecular-dynamics-forge"
Repository = "https://github.com/SamDozer/molecular-dynamics-forge"

[project.scripts]
moldynx = "moldynx.cli.main:main"
# Deprecated alias kept for one minor version after the rename from mdforge.
mdforge = "moldynx.cli.main:main"

# Third-party packages advertise plugins under this entry-point group
# (the legacy "mdforge.plugins" group is still read, with a deprecation warning).
# [project.entry-points."moldynx.plugins"]
# my_analysis = "my_package.my_module"

[tool.setuptools.packages.find]
include = ["moldynx*", "mdforge*"]   # mdforge = deprecated import shim

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
